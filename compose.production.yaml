services:
  client:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '5050:80'
    depends_on:
      - db

  scheduler:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl
        echo "*/3 * * * * curl -fsS -X POST http://client:3000/api/cron/orders-digest -H \"Authorization: Bearer $$CRON_SECRET\" >/proc/1/fd/1 2>/proc/1/fd/2" > /etc/crontabs/root
        crond -f -l 2
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - client
    restart: unless-stopped

volumes:
  postgres-data:
